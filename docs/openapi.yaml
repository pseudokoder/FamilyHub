# FamilyHub v1 — the API contract, in OpenAPI 3.0.
#
# WHY THIS FILE EXISTS (read this before the YAML):
# v1 renders HTML, but every route was designed RESTfully so that v2 can
# serve JSON from the same URLs to an Angular frontend. This file writes
# that contract down in the industry-standard format (D288 calls this
# API-first design). Two things keep it honest:
#
#   1. tests/test_openapi.py walks Flask's live route map and FAILS if any
#      route is missing from this file — the spec cannot silently drift.
#   2. /apidocs renders this file as a browsable page (server-side, so it
#      satisfies the strict CSP — no Swagger UI inline-style exceptions).
#
# WP1 RE-FOUNDATION (Master Plan §1): this spec was trimmed to the surviving
# infrastructure surface — auth, the admin panel, and public/plumbing routes.
# The old feature routes (albums, posts, wiki, timeline, plans, search) were
# removed with the feature layer. WP2 produces the *real* v1 API contract — the
# CRUD + view endpoints for the GEDCOM-7 schema — and that becomes the stable
# interface Cowork builds the front-end against (Master Plan §7).
#
# Conventions: HTML-form routes are marked as returning text/html today;
# v2 swaps those responses to application/json without touching the paths.

openapi: "3.0.3"
info:
  title: FamilyHub API
  version: "1.0"
  description: >
    Private, GEDCOM-7-backed family portal. All family content requires a
    session cookie (login). The /api/* surface is the WP2 JSON CRUD + search
    contract Cowork builds the WP3 front-end against; reads need any logged-in
    member, writes need at least the USER role (§10). State-changing /api calls
    must send the CSRF token in an X-CSRFToken header. The auth/admin/plumbing
    routes render HTML today; v2 can serve JSON from the same URLs.

tags:
  - name: Auth
    description: Login, logout, password self-service
  - name: Admin
    description: Requires the admin flag
  - name: Plumbing
    description: Health, crawler policy, PWA shell, security contact, docs
  - name: Individuals
    description: People in the tree (INDI) and their names
  - name: Families
    description: Partnerships (FAM) and parent/child links
  - name: Events
    description: Events & attributes (BIRT, DEAT, MARR, OCCU…), polymorphic
  - name: Places
    description: Reusable PLAC records
  - name: Sources
    description: Repositories, sources, and citations (the evidence layer)
  - name: Media
    description: Photo uploads (OBJE), login-walled, with polymorphic links
  - name: Notes
    description: Markdown memories/bios (NOTE/SNOTE) with polymorphic links
  - name: Search
    description: People by name + filters, and full-text over notes (§12)
  - name: WriteControl
    description: Audit trail, restore, and revert — post-moderation (ADR-0001)

paths:
  # --- Plumbing ---------------------------------------------------------------
  /:
    get: {tags: [Plumbing], summary: Public welcome page (dashboard when logged in), responses: {"200": {description: HTML page}}}
  /health:
    get:
      tags: [Plumbing]
      summary: Liveness check for monitors
      responses:
        "200": {description: '{"status":"ok","database":"ok"}'}
        "503": {description: Database unreachable}
  /robots.txt:
    get: {tags: [Plumbing], summary: "Crawler policy: index nothing", responses: {"200": {description: text/plain}}}
  /manifest.webmanifest:
    get: {tags: [Plumbing], summary: PWA web-app manifest (name, icons, colors), responses: {"200": {description: application/manifest+json}}}
  /sw.js:
    get: {tags: [Plumbing], summary: Service worker (static shell cache + offline fallback; never caches photos), responses: {"200": {description: text/javascript}}}
  /offline:
    get: {tags: [Plumbing], summary: Standalone offline fallback page (precached by the service worker), responses: {"200": {description: HTML page}}}
  /.well-known/security.txt:
    get: {tags: [Plumbing], summary: RFC 9116 security contact, responses: {"200": {description: text/plain}}}
  /about:
    get: {tags: [Plumbing], summary: Admin-written about/contact page, responses: {"200": {description: HTML page}}}
  /site/hero:
    get: {tags: [Plumbing], summary: Dashboard banner image (login-walled), responses: {"200": {description: image bytes}}}
  /apidocs:
    get: {tags: [Plumbing], summary: This spec, rendered as a browsable page, responses: {"200": {description: HTML page}}}
  /openapi.yaml:
    get: {tags: [Plumbing], summary: This spec, raw, responses: {"200": {description: text/yaml}}}

  # --- Auth --------------------------------------------------------------------
  /auth/login:
    get: {tags: [Auth], summary: Login form, responses: {"200": {description: HTML form}}}
    post:
      tags: [Auth]
      summary: Authenticate (rate-limited 10/min/IP)
      responses:
        "302": {description: Redirect home with session cookie}
        "200": {description: Form re-rendered with vague error}
        "429": {description: Rate limit hit}
  /auth/logout:
    post: {tags: [Auth], summary: End the session (POST-only by design), responses: {"302": {description: Redirect home}}}
  /auth/change-password:
    get: {tags: [Auth], summary: Change-own-password form, responses: {"200": {description: HTML form}}}
    post: {tags: [Auth], summary: Change own password (current password required), responses: {"302": {description: Changed}}}
  /auth/forgot-password:
    get: {tags: [Auth], summary: Request-reset form (hidden if mail unconfigured), responses: {"200": {description: HTML form}}}
    post:
      tags: [Auth]
      summary: Email a reset link (rate-limited 5/min; identical response for unknown usernames)
      responses: {"302": {description: Same friendly message either way}}
  /auth/reset-password/{token}:
    parameters: [{name: token, in: path, required: true, schema: {type: string}, description: Signed single-use token (1h)}]
    get: {tags: [Auth], summary: New-password form (token checked first), responses: {"200": {description: HTML form}, "302": {description: Invalid/expired token}}}
    post: {tags: [Auth], summary: Set the new password, responses: {"302": {description: Reset complete}}}

  # --- Admin -------------------------------------------------------------------
  /admin/users:
    get: {tags: [Admin], summary: Every account, responses: {"200": {description: HTML page}, "403": {description: Admins only}}}
  /admin/users/new:
    get: {tags: [Admin], summary: New-account form (no self-registration exists), responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Create an account, responses: {"302": {description: Created}}}
  /admin/users/{user_id}/edit:
    parameters: [{name: user_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Admin], summary: Edit display name / reset email, responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Save account changes, responses: {"302": {description: Saved}}}
  /admin/users/{user_id}/reset-password:
    parameters: [{name: user_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Admin], summary: Reset-password form, responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Set a new password for the user, responses: {"302": {description: Set}}}
  /admin/settings:
    get: {tags: [Admin], summary: Site text + hero image form, responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Save settings / upload hero, responses: {"302": {description: Saved}}}
  /admin/backups:
    get: {tags: [Admin], summary: List local backups, responses: {"200": {description: HTML page}}}
  /admin/backups/run:
    post: {tags: [Admin], summary: Create, verify, and (if configured) upload a backup, responses: {"302": {description: Report via flash messages}}}
  /admin/backups/{filename}/download:
    parameters: [{name: filename, in: path, required: true, schema: {type: string}, description: Must match a known backup name — no path tricks}]
    get: {tags: [Admin], summary: Download a backup zip, responses: {"200": {description: zip bytes}, "404": {description: Unknown filename}}}
  /admin/activity:
    get: {tags: [Admin], summary: The audit trail — who did what, newest first, responses: {"200": {description: HTML page}}}

  # ============================================================================
  # GENEALOGY JSON API (WP2) — the contract Cowork builds WP3 against.
  # Every write (POST/PUT/DELETE) needs the USER role and an X-CSRFToken header.
  # Standard responses: 200/201 ok, 204 deleted, 400 validation, 401 not logged
  # in, 403 wrong role, 404 missing, 409 duplicate link.
  # ============================================================================

  # --- Individuals + Names ----------------------------------------------------
  /api/individuals:
    get:
      tags: [Individuals]
      summary: List individuals (light — primary name + counts)
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {individuals: {type: array, items: {$ref: '#/components/schemas/Individual'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}
    post:
      tags: [Individuals]
      summary: Create an individual (optional inline primary `name` object)
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Individual'}}}}
      responses: {"201": {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Individual'}}}}, "400": {$ref: '#/components/responses/BadRequest'}, "401": {$ref: '#/components/responses/Unauthorized'}, "403": {$ref: '#/components/responses/Forbidden'}}
  /api/individuals/{individual_id}:
    parameters: [{name: individual_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Individuals], summary: One individual with all names, responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Individual'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Individuals], summary: Update fields (sex/living/restriction/gedcom_xref), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Individual'}}}}, responses: {"200": {description: Updated}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
    delete: {tags: [Individuals], summary: Delete the individual + names + all polymorphic attachments, responses: {"204": {description: Deleted}, "403": {$ref: '#/components/responses/Forbidden'}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/individuals/{individual_id}/names:
    parameters: [{name: individual_id, in: path, required: true, schema: {type: integer}}]
    post: {tags: [Individuals], summary: Add a name (needs a given or surname), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}, responses: {"201": {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}, "400": {$ref: '#/components/responses/BadRequest'}}}
  /api/names/{name_id}:
    parameters: [{name: name_id, in: path, required: true, schema: {type: integer}}]
    put: {tags: [Individuals], summary: Update a name (is_primary steals primary from the others), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Name'}}}}, responses: {"200": {description: Updated}, "404": {$ref: '#/components/responses/NotFound'}}}
    delete: {tags: [Individuals], summary: Delete a name, responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}

  # --- Families + Children ----------------------------------------------------
  /api/families:
    get: {tags: [Families], summary: List families, responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {families: {type: array, items: {$ref: '#/components/schemas/Family'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}}
    post: {tags: [Families], summary: Create a family (partner ids must exist), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Family'}}}}, responses: {"201": {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Family'}}}}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
  /api/families/{family_id}:
    parameters: [{name: family_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Families], summary: One family with children, responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Family'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Families], summary: Update partners / gedcom_xref, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Family'}}}}, responses: {"200": {description: Updated}, "400": {$ref: '#/components/responses/BadRequest'}}}
    delete: {tags: [Families], summary: Delete the family + child links + polymorphic attachments, responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/families/{family_id}/children:
    parameters: [{name: family_id, in: path, required: true, schema: {type: integer}}]
    post: {tags: [Families], summary: "Add a child link (child_id required; pedigree_type: birth|adopted|foster|step)", requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/FamilyChild'}}}}, responses: {"201": {description: Linked}, "400": {$ref: '#/components/responses/BadRequest'}, "409": {description: Child already in this family}}}
  /api/families/{family_id}/children/{child_id}:
    parameters: [{name: family_id, in: path, required: true, schema: {type: integer}}, {name: child_id, in: path, required: true, schema: {type: integer}}]
    delete: {tags: [Families], summary: Remove a child link, responses: {"204": {description: Removed}, "404": {$ref: '#/components/responses/NotFound'}}}

  # --- Events -----------------------------------------------------------------
  /api/events:
    get:
      tags: [Events]
      summary: List events (optionally filtered to one subject), timeline-ordered
      parameters: [{name: subject_type, in: query, schema: {type: string, enum: [individual, family]}}, {name: subject_id, in: query, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {events: {type: array, items: {$ref: '#/components/schemas/Event'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}
    post: {tags: [Events], summary: Create an event (subject_type/subject_id + event_tag required), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}, responses: {"201": {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
  /api/events/{event_id}:
    parameters: [{name: event_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Events], summary: One event, responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Events], summary: Update an event, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}, responses: {"200": {description: Updated}, "400": {$ref: '#/components/responses/BadRequest'}}}
    delete: {tags: [Events], summary: Delete an event + its attachments, responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}

  # --- Places -----------------------------------------------------------------
  /api/places:
    get: {tags: [Places], summary: List places, responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {places: {type: array, items: {$ref: '#/components/schemas/Place'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}}
    post: {tags: [Places], summary: Create a place (full_name required), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Place'}}}}, responses: {"201": {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Place'}}}}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
  /api/places/{place_id}:
    parameters: [{name: place_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Places], summary: One place, responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Place'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Places], summary: Update a place, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Place'}}}}, responses: {"200": {description: Updated}, "400": {$ref: '#/components/responses/BadRequest'}}}
    delete: {tags: [Places], summary: Delete a place (events that used it are detached), responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}

  # --- Sources / Repositories / Citations -------------------------------------
  /api/repositories:
    get: {tags: [Sources], summary: List repositories, responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {repositories: {type: array, items: {$ref: '#/components/schemas/Repository'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}}
    post: {tags: [Sources], summary: Create a repository (name required), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Repository'}}}}, responses: {"201": {description: Created}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
  /api/repositories/{repo_id}:
    parameters: [{name: repo_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Sources], summary: One repository, responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Repository'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Sources], summary: Update a repository, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Repository'}}}}, responses: {"200": {description: Updated}}}
    delete: {tags: [Sources], summary: Delete a repository (its sources are detached), responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/sources:
    get: {tags: [Sources], summary: List sources, responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {sources: {type: array, items: {$ref: '#/components/schemas/Source'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}}
    post: {tags: [Sources], summary: Create a source (title required), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}, responses: {"201": {description: Created}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
  /api/sources/{source_id}:
    parameters: [{name: source_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Sources], summary: One source, responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Sources], summary: Update a source, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}, responses: {"200": {description: Updated}, "400": {$ref: '#/components/responses/BadRequest'}}}
    delete: {tags: [Sources], summary: Delete a source (cascades its citations), responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/citations:
    get:
      tags: [Sources]
      summary: List citations (optionally for one subject)
      parameters: [{name: subject_type, in: query, schema: {type: string, enum: [individual, family, event, name]}}, {name: subject_id, in: query, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {citations: {type: array, items: {$ref: '#/components/schemas/Citation'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}
    post: {tags: [Sources], summary: Create a citation (source_id + subject required; quality 0–3), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Citation'}}}}, responses: {"201": {description: Created}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
  /api/citations/{citation_id}:
    parameters: [{name: citation_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Sources], summary: One citation, responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Citation'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Sources], summary: Update a citation, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Citation'}}}}, responses: {"200": {description: Updated}, "400": {$ref: '#/components/responses/BadRequest'}}}
    delete: {tags: [Sources], summary: Delete a citation, responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}

  # --- Media ------------------------------------------------------------------
  /api/media:
    get:
      tags: [Media]
      summary: List media (optionally for one subject)
      parameters: [{name: subject_type, in: query, schema: {type: string, enum: [individual, family, event]}}, {name: subject_id, in: query, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {media: {type: array, items: {$ref: '#/components/schemas/Media'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}
    post:
      tags: [Media]
      summary: Upload an image (multipart); EXIF/GPS stripped, stored outside web root
      requestBody: {content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}, title: {type: string}, description: {type: string}, subject_type: {type: string}, subject_id: {type: integer}}}}}}
      responses: {"201": {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}
  /api/media/{media_id}:
    parameters: [{name: media_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Media], summary: One media object (with links), responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Media], summary: Update metadata (title/description/gedcom_xref; bytes are immutable), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Media'}}}}, responses: {"200": {description: Updated}}}
    delete: {tags: [Media], summary: Delete the media object + its files + links, responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/media/{media_id}/file:
    parameters: [{name: media_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Media], summary: Full image bytes (login-walled), responses: {"200": {description: image bytes}, "401": {$ref: '#/components/responses/Unauthorized'}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/media/{media_id}/thumb:
    parameters: [{name: media_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Media], summary: Thumbnail bytes (login-walled), responses: {"200": {description: image bytes}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/media/{media_id}/links:
    parameters: [{name: media_id, in: path, required: true, schema: {type: integer}}]
    post: {tags: [Media], summary: Attach the photo to a subject, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Link'}}}}, responses: {"201": {description: Linked}, "400": {$ref: '#/components/responses/BadRequest'}, "409": {description: Already linked}}}
  /api/media/{media_id}/links/{subject_type}/{subject_id}:
    parameters: [{name: media_id, in: path, required: true, schema: {type: integer}}, {name: subject_type, in: path, required: true, schema: {type: string}}, {name: subject_id, in: path, required: true, schema: {type: integer}}]
    delete: {tags: [Media], summary: Remove an attachment, responses: {"204": {description: Removed}, "404": {$ref: '#/components/responses/NotFound'}}}

  # --- Notes ------------------------------------------------------------------
  /api/notes:
    get:
      tags: [Notes]
      summary: List notes (optionally for one subject), newest first
      parameters: [{name: subject_type, in: query, schema: {type: string, enum: [individual, family, event]}}, {name: subject_id, in: query, schema: {type: integer}}]
      responses: {"200": {description: OK, content: {application/json: {schema: {type: object, properties: {notes: {type: array, items: {$ref: '#/components/schemas/Note'}}}}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}
    post: {tags: [Notes], summary: Write a note (content required; author set from the session; optional inline subject), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Note'}}}}, responses: {"201": {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Note'}}}}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}}}
  /api/notes/{note_id}:
    parameters: [{name: note_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Notes], summary: One note (with links), responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Note'}}}}, "404": {$ref: '#/components/responses/NotFound'}}}
    put: {tags: [Notes], summary: Update a note (title/content/content_type/is_shared), requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Note'}}}}, responses: {"200": {description: Updated}, "400": {$ref: '#/components/responses/BadRequest'}}}
    delete: {tags: [Notes], summary: Delete a note + its links, responses: {"204": {description: Deleted}, "404": {$ref: '#/components/responses/NotFound'}}}
  /api/notes/{note_id}/links:
    parameters: [{name: note_id, in: path, required: true, schema: {type: integer}}]
    post: {tags: [Notes], summary: Attach the note to a subject, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/Link'}}}}, responses: {"201": {description: Linked}, "400": {$ref: '#/components/responses/BadRequest'}, "409": {description: Already linked}}}
  /api/notes/{note_id}/links/{subject_type}/{subject_id}:
    parameters: [{name: note_id, in: path, required: true, schema: {type: integer}}, {name: subject_type, in: path, required: true, schema: {type: string}}, {name: subject_id, in: path, required: true, schema: {type: integer}}]
    delete: {tags: [Notes], summary: Remove an attachment, responses: {"204": {description: Removed}, "404": {$ref: '#/components/responses/NotFound'}}}

  # --- Search -----------------------------------------------------------------
  /api/search:
    get:
      tags: [Search]
      summary: People by name + filters, and full-text over notes (§12)
      parameters:
        - {name: q, in: query, schema: {type: string}, description: free text — matches names AND notes}
        - {name: given, in: query, schema: {type: string}}
        - {name: surname, in: query, schema: {type: string}}
        - {name: sex, in: query, schema: {type: string, enum: [M, F, X, U]}}
        - {name: living, in: query, schema: {type: boolean}}
        - {name: birth_from, in: query, schema: {type: integer}}
        - {name: birth_to, in: query, schema: {type: integer}}
        - {name: place, in: query, schema: {type: string}}
      responses: {"200": {description: Grouped results, content: {application/json: {schema: {$ref: '#/components/schemas/SearchResults'}}}}, "401": {$ref: '#/components/responses/Unauthorized'}}

  # --- Write control: activity feed, restore, revert (ADR-0001) ---------------
  /api/activity:
    get:
      tags: [WriteControl]
      summary: The audit trail — paginated, filterable (Curator+; ADR-0001)
      parameters:
        - {name: action, in: query, schema: {type: string, enum: [create, update, delete, restore, revert]}}
        - {name: actor_id, in: query, schema: {type: integer}}
        - {name: subject_type, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: per_page, in: query, schema: {type: integer, default: 50, maximum: 200}}
      responses: {"200": {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityPage'}}}}, "401": {$ref: '#/components/responses/Unauthorized'}, "403": {$ref: '#/components/responses/Forbidden'}}
  /api/restore:
    post:
      tags: [WriteControl]
      summary: Un-delete a soft-deleted record (permission&#58; revert)
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [subject_type, subject_id], properties: {subject_type: {type: string, enum: [individual, name, family, event, source, citation, media, note]}, subject_id: {type: integer}}}}}}
      responses: {"200": {description: Restored (returns the row snapshot)}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}, "404": {$ref: '#/components/responses/NotFound'}}
  /api/audit/{audit_id}/revert:
    parameters: [{name: audit_id, in: path, required: true, schema: {type: integer}}]
    post:
      tags: [WriteControl]
      summary: Undo the change an audit entry describes (permission&#58; revert)
      responses: {"200": {description: Reverted (result is the new snapshot, or null if now deleted)}, "400": {$ref: '#/components/responses/BadRequest'}, "403": {$ref: '#/components/responses/Forbidden'}, "404": {$ref: '#/components/responses/NotFound'}}

components:
  responses:
    Unauthorized: {description: Not logged in, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Logged in but lacking the required role, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: No such record, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    BadRequest: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
        fields: {type: object, additionalProperties: {type: string}, description: per-field problems (present on validation errors)}
    AuditEntry:
      type: object
      description: One row of the write-control audit trail (ADR-0001).
      properties:
        id: {type: integer, readOnly: true}
        action: {type: string, description: create|update|delete|restore|revert (or a security/admin verb)}
        actor_id: {type: integer, nullable: true}
        actor: {type: string, nullable: true, description: the actor's display name}
        subject_type: {type: string, example: individual}
        subject_id: {type: integer, nullable: true}
        detail: {type: string}
        created_at: {type: string, format: date-time, readOnly: true}
    ActivityPage:
      type: object
      description: A page of audit entries plus pagination metadata.
      properties:
        activity: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        pages: {type: integer}
    Name:
      type: object
      description: A name belonging to an individual (system fields are read-only).
      properties:
        id: {type: integer, readOnly: true}
        individual_id: {type: integer, readOnly: true}
        name_type: {type: string, example: birth, description: birth|married|aka|immigrant|maiden}
        name_prefix: {type: string, nullable: true}
        given: {type: string, nullable: true}
        nickname: {type: string, nullable: true}
        surname_prefix: {type: string, nullable: true}
        surname: {type: string, nullable: true}
        name_suffix: {type: string, nullable: true}
        is_primary: {type: boolean}
        sort_order: {type: integer}
        display: {type: string, readOnly: true, description: reassembled full name}
    Individual:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        gedcom_xref: {type: string, nullable: true}
        sex: {type: string, nullable: true, enum: [M, F, X, U, null]}
        living: {type: boolean, default: true}
        restriction: {type: string, nullable: true, description: GEDCOM RESN}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
        primary_name: {type: string, nullable: true, readOnly: true}
        names_count: {type: integer, readOnly: true}
        names: {type: array, items: {$ref: '#/components/schemas/Name'}, description: present on detail GET}
        name: {$ref: '#/components/schemas/Name', description: write-only — an optional inline primary name on create}
    FamilyChild:
      type: object
      properties:
        family_id: {type: integer, readOnly: true}
        child_id: {type: integer}
        child_name: {type: string, readOnly: true}
        pedigree_type: {type: string, enum: [birth, adopted, foster, step], default: birth}
        child_order: {type: integer, default: 0}
    Family:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        gedcom_xref: {type: string, nullable: true}
        partner1_id: {type: integer, nullable: true}
        partner2_id: {type: integer, nullable: true}
        partner1: {type: string, nullable: true, readOnly: true}
        partner2: {type: string, nullable: true, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
        children_count: {type: integer, readOnly: true}
        children: {type: array, items: {$ref: '#/components/schemas/FamilyChild'}}
    Place:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        full_name: {type: string}
        city: {type: string, nullable: true}
        county: {type: string, nullable: true}
        state: {type: string, nullable: true}
        country: {type: string, nullable: true}
        latitude: {type: number, nullable: true}
        longitude: {type: number, nullable: true}
    Event:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        subject_type: {type: string, enum: [individual, family]}
        subject_id: {type: integer}
        subject_label: {type: string, nullable: true, readOnly: true}
        event_tag: {type: string, example: BIRT, description: GEDCOM tag}
        event_value: {type: string, nullable: true, description: attribute value, e.g. an occupation}
        date_original: {type: string, nullable: true, example: ABT 1850}
        date_sort: {type: string, nullable: true, example: "1850-00-00"}
        place_id: {type: integer, nullable: true}
        place: {type: string, nullable: true, readOnly: true}
        age: {type: string, nullable: true}
        cause: {type: string, nullable: true}
        created_at: {type: string, format: date-time, readOnly: true}
    Repository:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        gedcom_xref: {type: string, nullable: true}
        name: {type: string}
        address: {type: string, nullable: true}
        website: {type: string, nullable: true}
        sources_count: {type: integer, readOnly: true}
    Source:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        gedcom_xref: {type: string, nullable: true}
        title: {type: string}
        author: {type: string, nullable: true}
        publication: {type: string, nullable: true}
        repository_id: {type: integer, nullable: true}
        repository: {type: string, nullable: true, readOnly: true}
        citations_count: {type: integer, readOnly: true}
    Citation:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        source_id: {type: integer}
        source_title: {type: string, nullable: true, readOnly: true}
        subject_type: {type: string, enum: [individual, family, event, name]}
        subject_id: {type: integer}
        subject_label: {type: string, nullable: true, readOnly: true}
        page: {type: string, nullable: true}
        quality: {type: integer, nullable: true, minimum: 0, maximum: 3, description: GEDCOM QUAY}
        notes: {type: string, nullable: true}
    Link:
      type: object
      description: A polymorphic attachment target.
      required: [subject_type, subject_id]
      properties:
        subject_type: {type: string, enum: [individual, family, event]}
        subject_id: {type: integer}
        subject_label: {type: string, nullable: true, readOnly: true}
    Media:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        gedcom_xref: {type: string, nullable: true}
        file_path: {type: string, readOnly: true}
        media_type: {type: string, readOnly: true, example: image/jpeg}
        title: {type: string, nullable: true}
        description: {type: string, nullable: true}
        uploaded_by: {type: integer, nullable: true, readOnly: true}
        uploader: {type: string, nullable: true, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        file_url: {type: string, readOnly: true}
        thumb_url: {type: string, readOnly: true}
        links_count: {type: integer, readOnly: true}
        links: {type: array, items: {$ref: '#/components/schemas/Link'}}
    Note:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        gedcom_xref: {type: string, nullable: true}
        title: {type: string, nullable: true}
        content: {type: string, description: raw Markdown}
        content_type: {type: string, enum: [markdown, plain], default: markdown}
        is_shared: {type: boolean, default: false}
        author_id: {type: integer, nullable: true, readOnly: true}
        author: {type: string, nullable: true, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
        links_count: {type: integer, readOnly: true}
        links: {type: array, items: {$ref: '#/components/schemas/Link'}}
        subject_type: {type: string, writeOnly: true, description: optional inline attachment on create}
        subject_id: {type: integer, writeOnly: true}
    SearchResults:
      type: object
      properties:
        query: {type: string}
        counts: {type: object, properties: {people: {type: integer}, notes: {type: integer}}}
        people:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string, nullable: true}
              sex: {type: string, nullable: true}
              living: {type: boolean}
              birth_year: {type: integer, nullable: true}
              death_year: {type: integer, nullable: true}
        notes:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              title: {type: string, nullable: true}
              snippet: {type: string}
              author: {type: string, nullable: true}
