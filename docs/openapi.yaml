# FamilyHub v1 — the API contract, in OpenAPI 3.0.
#
# WHY THIS FILE EXISTS (read this before the YAML):
# v1 renders HTML, but every route was designed RESTfully so that v2 can
# serve JSON from the same URLs to an Angular frontend. This file writes
# that contract down in the industry-standard format (D288 calls this
# API-first design). Two things keep it honest:
#
#   1. tests/test_openapi.py walks Flask's live route map and FAILS if any
#      route is missing from this file — the spec cannot silently drift.
#   2. /apidocs renders this file as a browsable page (server-side, so it
#      satisfies the strict CSP — no Swagger UI inline-style exceptions).
#
# WP1 RE-FOUNDATION (Master Plan §1): this spec was trimmed to the surviving
# infrastructure surface — auth, the admin panel, and public/plumbing routes.
# The old feature routes (albums, posts, wiki, timeline, plans, search) were
# removed with the feature layer. WP2 produces the *real* v1 API contract — the
# CRUD + view endpoints for the GEDCOM-7 schema — and that becomes the stable
# interface Cowork builds the front-end against (Master Plan §7).
#
# Conventions: HTML-form routes are marked as returning text/html today;
# v2 swaps those responses to application/json without touching the paths.

openapi: "3.0.3"
info:
  title: FamilyHub API
  version: "1.0"
  description: >
    Private, GEDCOM-7-backed family portal. All family content requires a
    session cookie (login). This WP1 contract covers the preserved
    infrastructure only — authentication, the admin panel, and plumbing;
    the genealogy CRUD/view endpoints land in WP2.

tags:
  - name: Auth
    description: Login, logout, password self-service
  - name: Admin
    description: Requires the admin flag
  - name: Plumbing
    description: Health, crawler policy, PWA shell, security contact, docs

paths:
  # --- Plumbing ---------------------------------------------------------------
  /:
    get: {tags: [Plumbing], summary: Public welcome page (dashboard when logged in), responses: {"200": {description: HTML page}}}
  /health:
    get:
      tags: [Plumbing]
      summary: Liveness check for monitors
      responses:
        "200": {description: '{"status":"ok","database":"ok"}'}
        "503": {description: Database unreachable}
  /robots.txt:
    get: {tags: [Plumbing], summary: "Crawler policy: index nothing", responses: {"200": {description: text/plain}}}
  /manifest.webmanifest:
    get: {tags: [Plumbing], summary: PWA web-app manifest (name, icons, colors), responses: {"200": {description: application/manifest+json}}}
  /sw.js:
    get: {tags: [Plumbing], summary: Service worker (static shell cache + offline fallback; never caches photos), responses: {"200": {description: text/javascript}}}
  /offline:
    get: {tags: [Plumbing], summary: Standalone offline fallback page (precached by the service worker), responses: {"200": {description: HTML page}}}
  /.well-known/security.txt:
    get: {tags: [Plumbing], summary: RFC 9116 security contact, responses: {"200": {description: text/plain}}}
  /about:
    get: {tags: [Plumbing], summary: Admin-written about/contact page, responses: {"200": {description: HTML page}}}
  /site/hero:
    get: {tags: [Plumbing], summary: Dashboard banner image (login-walled), responses: {"200": {description: image bytes}}}
  /apidocs:
    get: {tags: [Plumbing], summary: This spec, rendered as a browsable page, responses: {"200": {description: HTML page}}}
  /openapi.yaml:
    get: {tags: [Plumbing], summary: This spec, raw, responses: {"200": {description: text/yaml}}}

  # --- Auth --------------------------------------------------------------------
  /auth/login:
    get: {tags: [Auth], summary: Login form, responses: {"200": {description: HTML form}}}
    post:
      tags: [Auth]
      summary: Authenticate (rate-limited 10/min/IP)
      responses:
        "302": {description: Redirect home with session cookie}
        "200": {description: Form re-rendered with vague error}
        "429": {description: Rate limit hit}
  /auth/logout:
    post: {tags: [Auth], summary: End the session (POST-only by design), responses: {"302": {description: Redirect home}}}
  /auth/change-password:
    get: {tags: [Auth], summary: Change-own-password form, responses: {"200": {description: HTML form}}}
    post: {tags: [Auth], summary: Change own password (current password required), responses: {"302": {description: Changed}}}
  /auth/forgot-password:
    get: {tags: [Auth], summary: Request-reset form (hidden if mail unconfigured), responses: {"200": {description: HTML form}}}
    post:
      tags: [Auth]
      summary: Email a reset link (rate-limited 5/min; identical response for unknown usernames)
      responses: {"302": {description: Same friendly message either way}}
  /auth/reset-password/{token}:
    parameters: [{name: token, in: path, required: true, schema: {type: string}, description: Signed single-use token (1h)}]
    get: {tags: [Auth], summary: New-password form (token checked first), responses: {"200": {description: HTML form}, "302": {description: Invalid/expired token}}}
    post: {tags: [Auth], summary: Set the new password, responses: {"302": {description: Reset complete}}}

  # --- Admin -------------------------------------------------------------------
  /admin/users:
    get: {tags: [Admin], summary: Every account, responses: {"200": {description: HTML page}, "403": {description: Admins only}}}
  /admin/users/new:
    get: {tags: [Admin], summary: New-account form (no self-registration exists), responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Create an account, responses: {"302": {description: Created}}}
  /admin/users/{user_id}/edit:
    parameters: [{name: user_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Admin], summary: Edit display name / reset email, responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Save account changes, responses: {"302": {description: Saved}}}
  /admin/users/{user_id}/reset-password:
    parameters: [{name: user_id, in: path, required: true, schema: {type: integer}}]
    get: {tags: [Admin], summary: Reset-password form, responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Set a new password for the user, responses: {"302": {description: Set}}}
  /admin/settings:
    get: {tags: [Admin], summary: Site text + hero image form, responses: {"200": {description: HTML form}}}
    post: {tags: [Admin], summary: Save settings / upload hero, responses: {"302": {description: Saved}}}
  /admin/backups:
    get: {tags: [Admin], summary: List local backups, responses: {"200": {description: HTML page}}}
  /admin/backups/run:
    post: {tags: [Admin], summary: Create, verify, and (if configured) upload a backup, responses: {"302": {description: Report via flash messages}}}
  /admin/backups/{filename}/download:
    parameters: [{name: filename, in: path, required: true, schema: {type: string}, description: Must match a known backup name — no path tricks}]
    get: {tags: [Admin], summary: Download a backup zip, responses: {"200": {description: zip bytes}, "404": {description: Unknown filename}}}
  /admin/activity:
    get: {tags: [Admin], summary: The audit trail — who did what, newest first, responses: {"200": {description: HTML page}}}
