# Continuous Integration — the robot reviewer that never sleeps.
#
# TEACHING NOTE: CI means every push to GitHub gets the full test suite run
# on a clean Linux machine GitHub spins up for free. Why that matters:
#
#   1. "Works on my machine" dies here — the runner has NOTHING installed,
#      so if requirements.txt is missing a package, CI fails loudly.
#   2. It runs on Linux, which is what the Lightsail production server runs.
#      Windows-only assumptions (path separators, line endings) get caught
#      before deployment instead of during it.
#   3. The green checkmark next to a commit on GitHub is the proof, visible
#      to anyone (including future employers), that the build is healthy.
#
# WGU connection: D480 (Software Design and Quality Assurance) calls this
# continuous integration; the Java-track equivalent you'll meet in v2 is
# the same Actions service running `mvn test`.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Step 1: get the code onto the runner (a fresh machine every time).
      - uses: actions/checkout@v4

      # Step 2: install the same Python the project uses, with pip's
      # download cache preserved between runs so installs are fast.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # Step 3: install exactly what requirements*.txt pins — the same
      # versions every developer machine and the production server use.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Step 4: the whole point. Any failing test fails the build.
      - name: Run the test suite
        run: python -m pytest -q

  # Second job: prove the Dockerfile actually builds. The dev machine is
  # Windows without Docker installed, so this job IS the Docker test —
  # a broken Dockerfile turns the badge red before deploy day finds it.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t familyhub:ci .
