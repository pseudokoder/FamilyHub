# FamilyHub nginx site config — /etc/nginx/sites-available/familyhub
# (symlink into sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`)
#
# nginx's three jobs here:
#   1. TLS termination (certbot --nginx adds the 443 block + redirect)
#   2. Serve /static/ files itself — fast, and gunicorn never sees them
#   3. Proxy everything else to gunicorn on localhost with the headers
#      Flask needs (set TRUST_PROXY=True in the server's .env so ProxyFix
#      reads them — rate limiting and HTTPS detection depend on it)

server {
    listen 80;
    server_name familyhub.pseudokoder.com;

    # Match Flask's MAX_CONTENT_LENGTH — otherwise nginx rejects big
    # photo batches with its own unfriendly 413 before Flask can.
    client_max_body_size 25m;

    location /static/ {
        alias /home/ubuntu/FamilyHub/app/static/;
        expires 30d;            # immutable-ish assets, cached hard
    }

    # NOTE: uploads/ is deliberately NOT served by nginx — photo bytes
    # must go through Flask's login wall (@login_required routes).

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
